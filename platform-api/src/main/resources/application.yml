spring:
  application:
    name: platform-api
  datasource:
    url: jdbc:postgresql://${PLATFORM_DB_HOST:localhost}:${PLATFORM_DB_PORT:5432}/${PLATFORM_DB_NAME:copilot_platform}
    username: ${PLATFORM_DB_USER:copilot}
    password: ${PLATFORM_DB_PASSWORD}
  flyway:
    create-schemas: true
    default-schema: copilot
    schemas: copilot
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    property-naming-strategy: SNAKE_CASE
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:2s}
      repositories:
        enabled: false

platform:
  security:
    jwt-secret: ${PLATFORM_JWT_SECRET}
    jwt-issuer: ${PLATFORM_JWT_ISSUER:enterprise-data-copilot}
    access-token-ttl: ${PLATFORM_ACCESS_TOKEN_TTL:PT30M}
  agent:
    service-token: ${AGENT_SERVICE_TOKEN}
    base-url: ${AGENT_SERVICE_URL:http://localhost:8000}
  execution:
    enabled: ${ANALYSIS_ASYNC_ENABLED:true}
    core-pool-size: ${ANALYSIS_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${ANALYSIS_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${ANALYSIS_ASYNC_QUEUE_CAPACITY:100}
    max-attempts: ${ANALYSIS_ASYNC_MAX_ATTEMPTS:3}
    retry-backoff: ${ANALYSIS_ASYNC_RETRY_BACKOFF:PT0.2S}
    event-retention: ${ANALYSIS_EVENT_RETENTION:PT1H}
    event-max-length: ${ANALYSIS_EVENT_MAX_LENGTH:500}
    sse-timeout: ${ANALYSIS_SSE_TIMEOUT:PT5M}
    dispatch-lease: ${ANALYSIS_DISPATCH_LEASE:PT5M}
  bootstrap:
    enabled: ${PLATFORM_BOOTSTRAP_ENABLED:false}
    tenant-slug: ${PLATFORM_BOOTSTRAP_TENANT_SLUG:northwind}
    tenant-name: ${PLATFORM_BOOTSTRAP_TENANT_NAME:Northwind Demo}
    admin-email: ${PLATFORM_BOOTSTRAP_ADMIN_EMAIL:admin@northwind.local}
    analyst-email: ${PLATFORM_BOOTSTRAP_ANALYST_EMAIL:analyst@northwind.local}
    password: ${PLATFORM_BOOTSTRAP_PASSWORD:change-me-demo}

server:
  port: ${PLATFORM_API_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
