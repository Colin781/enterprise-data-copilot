openapi: 3.1.0
info:
  title: Enterprise Data Copilot Platform API
  version: 0.1.0
  description: Browser-facing API owned by the Java platform service.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: getPlatformHealth
      tags: [operations]
      security: []
      responses:
        "200":
          description: The platform process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/auth/login:
    post:
      operationId: login
      tags: [identity]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A short-lived platform access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/data-sources:
    get:
      operationId: listDataSources
      tags: [data-sources]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Data sources in the authenticated tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDataSource
      description: ADMIN only. Credentials are supplied by reference and are never returned.
      tags: [data-sources]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDataSourceRequest"
      responses:
        "201":
          description: Tenant-scoped data source metadata was registered.
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /api/analysis/jobs:
    post:
      operationId: createAnalysisJob
      tags: [analysis]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisJobRequest"
      responses:
        "202":
          description: The analysis job was accepted.
          headers:
            Location:
              description: URL of the accepted analysis job.
              required: true
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJobResource"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/analysis/jobs/{jobId}:
    get:
      operationId: getAnalysisJob
      tags: [analysis]
      security:
        - bearerAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current analysis job state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisJobResource"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique key for safely replaying a create request.
      schema:
        type: string
        minLength: 16
        maxLength: 128
  responses:
    BadRequest:
      description: The request is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: The caller cannot access the requested tenant resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The resource was not found in the caller's authorized scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The idempotency key conflicts with an earlier request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableEntity:
      description: The request is well formed but violates an input rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    InternalError:
      description: The platform could not complete the request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, timestamp]
      properties:
        service:
          type: string
          const: platform-api
        status:
          type: string
          const: UP
        timestamp:
          type: string
          format: date-time
    AnalysisJobStatus:
      type: string
      enum:
        - CREATED
        - PLANNING
        - VALIDATING
        - WAITING_APPROVAL
        - RUNNING
        - COMPLETED
        - REJECTED
        - FAILED
        - CANCELLED
    CreateAnalysisJobRequest:
      type: object
      additionalProperties: false
      required: [data_source_id, question]
      properties:
        data_source_id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 1
          maxLength: 4000
    AnalysisJobResource:
      type: object
      additionalProperties: false
      required:
        - id
        - data_source_id
        - question
        - status
        - trace_id
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: string
          format: uuid
        data_source_id:
          type: string
          format: uuid
        question:
          type: string
        status:
          $ref: "#/components/schemas/AnalysisJobStatus"
        trace_id:
          type: string
          minLength: 16
          maxLength: 64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          $ref: "#/components/schemas/ApiError"
        version:
          type: integer
          format: int64
          minimum: 0
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant_slug, email, password]
      properties:
        tenant_slug:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 1
          maxLength: 200
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user_id, tenant_id, roles]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
        user_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ADMIN, ANALYST, VIEWER]
    CreateDataSourceRequest:
      type: object
      additionalProperties: false
      required: [name, host, port, database_name, allowed_schema, secret_ref]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        host:
          type: string
          minLength: 1
          maxLength: 255
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database_name:
          type: string
          minLength: 1
          maxLength: 128
        allowed_schema:
          type: string
          pattern: "^[a-z_][a-z0-9_]*$"
          maxLength: 63
        secret_ref:
          type: string
          writeOnly: true
          pattern: "^(env|vault|secret):[A-Za-z0-9_./-]+$"
          maxLength: 255
    DataSourceResource:
      type: object
      additionalProperties: false
      required: [id, name, source_type, allowed_schema, enabled, version]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source_type:
          type: string
          const: POSTGRESQL
        allowed_schema:
          type: string
        enabled:
          type: boolean
        version:
          type: integer
          format: int64
          minimum: 0
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, timestamp]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 500
        trace_id:
          type: string
          minLength: 16
          maxLength: 64
        timestamp:
          type: string
          format: date-time
        details:
          type: object
          additionalProperties: true
