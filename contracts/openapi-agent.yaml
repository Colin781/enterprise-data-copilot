openapi: 3.1.0
info:
  title: Enterprise Data Copilot Agent API
  version: 0.1.0
  description: Internal API called only by the Java platform service.
servers:
  - url: http://localhost:8000
paths:
  /health:
    get:
      operationId: getAgentHealth
      tags: [operations]
      security: []
      responses:
        "200":
          description: The agent process is running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /internal/v1/runs:
    post:
      operationId: startAgentRun
      tags: [runs]
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/UserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartRunRequest"
      responses:
        "202":
          description: The graph ran until completion or a durable interrupt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalError"
  /internal/v1/runs/{runId}/resume:
    post:
      operationId: resumeAgentRun
      tags: [runs]
      security:
        - serviceToken: []
      parameters:
        - name: runId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserRole"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRunRequest"
      responses:
        "200":
          description: The durable graph resumed with the one-time administrator decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /internal/v1/knowledge/documents:
    post:
      operationId: ingestMetricDocument
      description: Parses, versions and indexes one bounded metric document for the asserted tenant.
      tags: [knowledge]
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/Traceparent"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeIngestRequest"
      responses:
        "201":
          description: The document was indexed in the tenant knowledge store.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredMetricDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
components:
  securitySchemes:
    serviceToken:
      type: http
      scheme: bearer
      bearerFormat: service-token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    Traceparent:
      name: traceparent
      in: header
      required: true
      description: W3C Trace Context propagated by the Java platform service.
      schema:
        type: string
        minLength: 55
        maxLength: 255
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      description: Tenant identity asserted by the authenticated Java service.
      schema:
        type: string
        format: uuid
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: User identity asserted by the authenticated Java service.
      schema:
        type: string
        format: uuid
    UserRole:
      name: X-User-Role
      in: header
      required: true
      description: User role asserted by the authenticated Java service.
      schema:
        type: string
        enum: [ADMIN, ANALYST, VIEWER]
  responses:
    BadRequest:
      description: The internal request is malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"
    Unauthorized:
      description: The service token or trusted identity claim is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"
    Conflict:
      description: The idempotency key conflicts with an earlier request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"
    UnprocessableEntity:
      description: The request violates an internal workflow input rule.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"
    InternalError:
      description: The agent service could not accept the run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AgentError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status, version, timestamp]
      properties:
        service:
          type: string
          const: agent-service
        status:
          type: string
          const: UP
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    AnalysisJobStatus:
      type: string
      enum:
        - CREATED
        - PLANNING
        - VALIDATING
        - WAITING_APPROVAL
        - RUNNING
        - COMPLETED
        - REJECTED
        - FAILED
        - CANCELLED
    StartRunRequest:
      type: object
      additionalProperties: false
      required: [job_id, data_source_id, question, requested_at]
      properties:
        job_id:
          type: string
          format: uuid
        data_source_id:
          type: string
          format: uuid
        question:
          type: string
          minLength: 1
          maxLength: 4000
        requested_at:
          type: string
          format: date-time
    StartRunResponse:
      type: object
      additionalProperties: false
      required: [job_id, status, trace_id, accepted_at]
      properties:
        job_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AnalysisJobStatus"
        trace_id:
          type: string
          minLength: 16
          maxLength: 64
        accepted_at:
          type: string
          format: date-time
    ResumeRunRequest:
      type: object
      additionalProperties: false
      required: [approval_id, decision, decided_by]
      properties:
        approval_id:
          type: string
          format: uuid
        decision:
          type: string
          enum: [approved, rejected]
        decided_by:
          type: string
          format: uuid
        comment:
          type: string
          maxLength: 500
    WorkflowResult:
      type: object
      additionalProperties: false
      required: [run_id, status, state, updated_at]
      properties:
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PLANNING, WAITING_APPROVAL, COMPLETED, REJECTED, FAILED]
        state:
          type: object
          additionalProperties: true
        interrupt:
          type: object
          additionalProperties: true
        updated_at:
          type: string
          format: date-time
    KnowledgeIngestRequest:
      type: object
      additionalProperties: false
      required: [title, source_name, source_type, content_base64]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        source_name:
          type: string
          minLength: 1
          maxLength: 255
        source_type:
          type: string
          enum: [MARKDOWN, PDF]
        content_base64:
          type: string
          contentEncoding: base64
          maxLength: 14000000
    StoredMetricDocument:
      type: object
      additionalProperties: false
      required: [id, tenant_id, title, version, status, source_type, source_name, content_sha256, chunk_count, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        title:
          type: string
        version:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [ACTIVE, SUPERSEDED]
        source_type:
          type: string
          enum: [MARKDOWN, PDF]
        source_name:
          type: string
        content_sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        chunk_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentStep:
      type: object
      additionalProperties: false
      required: [name, status, started_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        status:
          type: string
          enum: [STARTED, SUCCEEDED, FAILED]
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    AgentDecision:
      type: object
      additionalProperties: false
      required: [decision, reason_code]
      properties:
        decision:
          type: string
          enum: [ACCEPTED, REJECTED, WAITING_APPROVAL]
        reason_code:
          type: string
          minLength: 1
          maxLength: 80
    AgentError:
      type: object
      additionalProperties: false
      required: [code, message, trace_id, timestamp]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 500
        trace_id:
          type: string
          minLength: 16
          maxLength: 64
        timestamp:
          type: string
          format: date-time
